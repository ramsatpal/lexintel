name: Update LEXINTEL feed
on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST daily
  workflow_dispatch: {}
concurrency: { group: update-feed, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run test:pipeline
      - name: Run ingestion
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_EXTRACTIONS_PER_RUN: "60"
        run: node pipeline/run.js
      - name: Commit updated feed
        run: |
          git config user.name "lexintel-bot"
          git config user.email "lexintel-bot@users.noreply.github.com"
          git add docs/feed.json pipeline/state.json
          git diff --cached --quiet || git commit -m "chore: update feed $(date -u +%F)"
          git push
